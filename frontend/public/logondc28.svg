<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Modern Vibrant Gradient -->
    <linearGradient id="ndcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: #0F172A; } /* Dark theme background for contrast */
    .logo-text {
      font-family: 'Montserrat', 'Inter', 'Segoe UI', sans-serif;
      font-weight: 900;
      font-size: 110px;
      letter-spacing: -2px;
      fill: url(#ndcGradient);
    }
    .accent-line {
      stroke: url(#ndcGradient);
      stroke-width: 6;
      stroke-linecap: round;
    }
  </style>

  <!-- Dark Background Plate -->
  <rect class="bg" width="800" height="300" rx="20" />

  <!-- Stylized Geometric Logo Graphics -->
  <g transform="translate(140, 165)">
    <!-- Main Text "NDC28" -->
    <text x="0" y="0" class="logo-text">NDC<tspan fill="#FFFFFF">28</tspan></text>

    <!-- Stylized Dynamic Swoosh / Cutline beneath -->
    <path class="accent-line" d="M 5,25 Q 260,45 510,-10" fill="none" />
    
    <!-- Decorative Stylized Dots -->
    <circle cx="515" cy="-10" r="5" fill="#10B981" />
  </g>
</svg>
